<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boom Boom Tower — Song link</title>
<style>html,body{margin:0;width:100%;height:100%;background:#080d1a;color:#e5ecff;font:14px system-ui}main{box-sizing:border-box;padding:12px}h1{font-size:18px;line-height:1.2;margin:0 0 8px}p{line-height:1.4;margin:0}#player{width:100%;height:100%;min-width:200px;min-height:200px}iframe{display:block;border:0}</style></head>
<body><main><h1>YouTube playback unavailable</h1><p id="status" role="status">Add a local audio file in the game to play this song. Your saved link is unchanged.</p></main>
<script>
'use strict';
// The normal release remains blocked. The authorized diagnostic integration emits
// public observations only; the independent Rust clock/guard owns gameplay.
const query=new URLSearchParams(location.search);
const session=query.get('session')||'';
const requestedVideo=query.get('video')||'';
const pollMs=Number(query.get('poll_ms'));
const startMs=Number(query.get('start_ms')||'0');
let sequence=0,player=null,ready=false,playerError=null,pageActive=true;
const validSession=/^[a-f0-9]{32}$/.test(session);
const validVideo=/^[A-Za-z0-9_-]{11}$/.test(requestedVideo);
const diagnostic=query.get('diagnostic')==='1'&&validSession&&validVideo&&
 Number.isSafeInteger(pollMs)&&pollMs>=16&&pollMs<=2000&&
 Number.isSafeInteger(startMs)&&startMs>=0;
const states=new Map([[-1,'unstarted'],[0,'ended'],[1,'playing'],[2,'paused'],[3,'buffering'],[5,'cued']]);
function send(observation){
 const text=JSON.stringify({session,sequence:++sequence,...observation});
 if(window.ipc&&typeof window.ipc.postMessage==='function')window.ipc.postMessage(text);
 else if(parent!==window)parent.postMessage(text,location.origin);
}
function visible(){return pageActive&&document.visibilityState==='visible';}
function videoId(url){
 const parsed=new URL(url);
 return parsed.hostname==='www.youtube.com'||parsed.hostname==='youtube.com'?
  parsed.searchParams.get('v')||'':'';
}
function observe(){
 let position=0,duration=0,rate=1,state='unstarted',id=requestedVideo;
 try{
  if(ready&&player){
   position=player.getCurrentTime()*1000;duration=player.getDuration()*1000;
   rate=player.getPlaybackRate();state=states.get(player.getPlayerState())||'unstarted';
   id=videoId(player.getVideoUrl());
  }
 }catch{playerError='The video player stopped responding.';}
 if(!Number.isFinite(position)||position<0||!Number.isFinite(duration)||duration<0||
    !Number.isFinite(rate)||rate<=0)playerError='The video player returned invalid playback information.';
 send({ready,visible:visible(),video_id:id,position_ms:Number.isFinite(position)?Math.max(0,position):0,
  duration_ms:Number.isFinite(duration)?Math.max(0,duration):0,rate:Number.isFinite(rate)&&rate>0?rate:1,
  state:playerError?'error':state,error:playerError});
}
function blocked(){
 send({ready:false,visible:visible(),video_id:requestedVideo,position_ms:0,rate:1,
  state:'error',error:document.getElementById('status').textContent,duration_ms:0});
}
function command(value){
 if(!diagnostic){blocked();return;}
 if(!ready||!player||!value||typeof value!=='object')return;
 // Only explicit user requests reach this channel. Observation/hold callbacks
 // never pause, seek, mute, skip or change the provider's playback.
 try{
  if(value.kind==='play'||value.kind==='resume')player.playVideo();
  else if(value.kind==='pause')player.pauseVideo();
  else if(value.kind==='rate'&&Number.isFinite(value.rate)&&value.rate>0){
   if(player.getAvailablePlaybackRates().includes(value.rate))player.setPlaybackRate(value.rate);
   else playerError='This video does not support the selected speed.';
  }
 }catch{playerError='The video player could not complete that action.';}
 observe();
}
window.bbtCommand=command;
addEventListener('message',event=>{
 if(event.source!==parent||event.origin!==location.origin)return;
 let value=event.data;
 if(typeof value==='string'){try{value=JSON.parse(value);}catch{return;}}
 command(value);
});
if(!diagnostic){blocked();}
else{
 document.querySelector('main').remove();
 const host=document.createElement('div');host.id='player';document.body.appendChild(host);
 window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('player',{width:'100%',height:'100%',videoId:requestedVideo,
   playerVars:{autoplay:0,playsinline:1,controls:1,origin:location.origin,start:startMs/1000},
   events:{onReady:()=>{ready=true;observe();},onStateChange:observe,onPlaybackRateChange:observe,
    onApiChange:observe,onAutoplayBlocked:observe,
    onError:event=>{playerError=`This video could not play (YouTube ${event.data}).`;observe();}}});
 };
 const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';
 script.onerror=()=>{playerError='YouTube could not be reached.';observe();};
 document.head.appendChild(script);
 document.addEventListener('visibilitychange',observe);
 addEventListener('pagehide',()=>{pageActive=false;observe();});
 addEventListener('pageshow',()=>{pageActive=true;observe();});
 setInterval(observe,pollMs);
 observe();
}
</script></body></html>
