<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boom Boom Tower — YouTube</title>
<style>html,body{margin:0;background:#080d1a;color:#e5ecff;font:14px system-ui;height:100%}main{height:calc(100% - 50px);min-height:200px}#player{width:100%;height:100%}p{margin:8px 12px}a{color:#9cceff}</style></head>
<body><main><div id="player"></div></main><p id="status" role="status" aria-live="polite">Loading YouTube…</p>
<script>
'use strict';
const query=new URL(location.href).searchParams;
const video=query.get('video')||'';
const start=Math.max(0,Number(query.get('start_ms')||0)/1000);
let player,ready=false,error=null,last=null,requested=false;
const status=document.getElementById('status');
function send(payload){const text=JSON.stringify(payload);if(window.ipc&&typeof window.ipc.postMessage==='function')window.ipc.postMessage(text);else if(parent!==window)parent.postMessage(text,location.origin);}
// In the browser build this page sits in a frame of the game's page, which sends the commands.
addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin)return;try{window.bbtCommand(JSON.parse(event.data));}catch(error){status.textContent='The game sent a player command this page could not read.';}});
function report(){
 if(!ready||!player)return;
 const raw=player.getCurrentTime(),state=player.getPlayerState(),rate=player.getPlaybackRate();
 const position=Math.max(0,(raw-start)*1000);
 const now=performance.now();
 if(last&&state===1&&last.state===1){
  const expected=(now-last.at)*rate;
  if(position<last.position-250||position-last.position>expected+1500){error='Playback was seeked. Restart the chart to synchronize it.';player.pauseVideo();}
 }
 last={position,at:now,state};
 const name=error?'error':state===1?'playing':state===0?'ended':state===3||state===-1?'buffering':'paused';
 status.textContent=error||({playing:'YouTube playing · game clock synchronized',buffering:'Buffering · game clock waiting',ended:'Track finished',paused:'Paused · press Play here if your browser requires it'})[name];
 send({ready:true,position_ms:position,rate,state:name,error,duration_ms:Math.max(0,(player.getDuration()-start)*1000)});
}
window.bbtCommand=function(command){
 if(!ready)return;
 switch(command.kind){
  case 'play': requested=true;error=null;last=null;player.seekTo(start,true);player.playVideo();break;
  case 'pause':player.pauseVideo();break;
  case 'resume':player.playVideo();break;
  case 'rate':{
   const rates=player.getAvailablePlaybackRates();
   if(!rates.some(rate=>Math.abs(rate-command.rate)<0.001)){error='This YouTube video does not support '+Math.round(command.rate*100)+'% speed. Choose a supported speed or local audio.';player.pauseVideo();}
   else player.setPlaybackRate(command.rate);
   break;
  }
 }
 report();
};
window.onYouTubeIframeAPIReady=function(){
 if(!/^[A-Za-z0-9_-]{11}$/.test(video)){status.textContent='A valid YouTube video is required.';send({ready:false,position_ms:0,rate:1,state:'error',error:status.textContent,duration_ms:0});return;}
 player=new YT.Player('player',{width:'100%',height:'100%',videoId:video,playerVars:{playsinline:1,controls:1,origin:location.origin,start:Math.floor(start)},events:{
  onReady(){ready=true;report();},onStateChange(){report();},onPlaybackRateChange(){last=null;report();},
  onError(event){error='YouTube could not play this video (code '+event.data+'). Choose another link or local audio.';status.textContent=error;send({ready,position_ms:0,rate:1,state:'error',error,duration_ms:0});}
 }});
};
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.async=true;script.onerror=()=>{status.textContent='YouTube could not be reached. Check your connection or choose local audio.';send({ready:false,position_ms:0,rate:1,state:'error',error:status.textContent,duration_ms:0});};document.head.append(script);
setInterval(report,20);
</script></body></html>
