<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Boom Boom Tower</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #05060c; color: #cfd6ff; font: 16px system-ui, sans-serif; overflow: hidden; }
  /* The engine sizes its canvas in pixels when it starts; the page decides the size. */
  #bbt-canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; display: block; touch-action: none; outline: none; }
  #status { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; pointer-events: none; }
  #status.done { display: none; }
  #bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #1b1f36; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #7f9bff; transition: width .15s; }
  #bbt-youtube { position: fixed; right: 12px; bottom: 12px; width: min(420px, 60vw); height: min(260px, 40vh); display: none; border: 1px solid #2b3358; border-radius: 8px; overflow: hidden; background: #080d1a; z-index: 5; }
  #bbt-youtube.open { display: block; }
  #bbt-youtube iframe { width: 100%; height: 100%; border: 0; }
  #farewell { position: fixed; inset: 0; display: none; place-content: center; gap: 16px; text-align: center; background: #05060c; }
  #farewell button { font: inherit; padding: 10px 22px; border-radius: 8px; border: 1px solid #7f9bff; background: #11162e; color: #cfd6ff; cursor: pointer; }
  #fatal { position: fixed; inset: 0; display: none; place-content: center; gap: 16px; padding: 24px; text-align: center; background: #05060c; }
  #fatal p { white-space: pre-wrap; margin: 0; }
  #fatal button { font: inherit; padding: 10px 22px; border-radius: 8px; border: 1px solid #7f9bff; background: #11162e; color: #cfd6ff; cursor: pointer; justify-self: center; }
</style>
</head>
<body>
<canvas id="bbt-canvas" tabindex="0"></canvas>
<div id="status"><div id="message">Loading Boom Boom Tower…</div><div id="bar"><div id="fill"></div></div></div>
<div id="bbt-youtube"></div>
<div id="fatal"><p id="fatal-text"></p><button id="reload" type="button">Reload</button></div>
<div id="farewell"><p>Thanks for playing Boom Boom Tower.</p><button id="again" type="button">Play again</button></div>
<script type="module" src="./boot.js"></script>
</body>
</html>
