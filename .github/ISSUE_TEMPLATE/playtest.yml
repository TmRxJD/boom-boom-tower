name: Playtest feedback
description: Tell us what felt good, awkward, or broken.
title: "[Playtest] "
body:
  - type: textarea
    id: experience
    attributes:
      label: What happened?
      description: What did you expect, and what did you see or hear?
    validations:
      required: true
  - type: input
    id: song
    attributes:
      label: Song, difficulty, and where it happened
      placeholder: Goldbox, Medium, around 1:20
  - type: input
    id: build
    attributes:
      label: Game version and controls
      placeholder: 2026-10-21 Windows playtest, Xbox controller
  - type: textarea
    id: system
    attributes:
      label: PC details, if performance is the issue
      description: Windows version, graphics card, resolution, and whether a bonus was active.
  - type: textarea
    id: media
    attributes:
      label: Screenshot or short clip
      description: Optional. Avoid personal information and copyrighted audio files.
